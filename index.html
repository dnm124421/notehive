<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>NoteHive — Student Notes Sharing Hive</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- jsPDF for Client-side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "var(--primary)",
            "on-primary": "var(--on-primary)",
            "primary-container": "var(--primary-container)",
            "on-primary-container": "var(--on-primary-container)",
            "primary-fixed": "var(--primary-fixed)",
            "secondary": "var(--secondary)",
            "on-secondary": "var(--on-secondary)",
            "secondary-container": "var(--secondary-container)",
            "on-secondary-container": "var(--on-secondary-container)",
            "secondary-fixed": "var(--secondary-fixed)",
            "tertiary": "var(--tertiary)",
            "on-tertiary": "var(--on-tertiary)",
            "tertiary-container": "var(--tertiary-container)",
            "on-tertiary-container": "var(--on-tertiary-container)",
            "tertiary-fixed": "var(--tertiary-fixed)",
            "surface-variant": "var(--surface-variant)",
            "error": "var(--error)",
            "on-error": "var(--on-error)",
            "background": "var(--background)",
            "on-background": "var(--on-background)",
            "surface": "var(--surface)",
            "surface-dim": "var(--surface-dim)",
            "surface-container-lowest": "var(--surface-container-lowest)",
            "surface-container-low": "var(--surface-container-low)",
            "surface-container": "var(--surface-container)",
            "surface-container-high": "var(--surface-container-high)",
            "surface-container-highest": "var(--surface-container-highest)",
            "on-surface": "var(--on-surface)",
            "on-surface-variant": "var(--on-surface-variant)"
          },
          fontFamily: {
            "headline-lg": ["Anybody", "sans-serif"],
            "headline-lg-mobile": ["Anybody", "sans-serif"],
            "headline-md": ["Anybody", "sans-serif"],
            "display-xl": ["Anybody", "sans-serif"],
            "label-bold": ["Space Grotesk", "Anybody", "sans-serif"],
            "body-md": ["Inter", "Work Sans", "sans-serif"],
            "body-lg": ["Inter", "Work Sans", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- Neo-Brutalist Theme Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-background font-body-md text-on-background min-h-screen">
  <!-- Dynamic Background Texture Layer (Midnight Radical) -->
  <div class="fixed inset-0 pointer-events-none opacity-0 dark:opacity-20 overflow-hidden mix-blend-overlay z-0 transition-opacity duration-300">
    <div class="absolute inset-0 bg-[radial-gradient(#fe00fe_1px,transparent_1px)] [background-size:24px_24px]"></div>
    <div class="absolute inset-0 bg-[repeating-linear-gradient(45deg,#000_0px,#000_10px,#1a1a1a_10px,#1a1a1a_11px)]"></div>
  </div>

  <!-- Fixed App Header (Visible when logged in) -->
  <header id="app-header" class="fixed top-0 w-full z-50 bg-surface border-b-4 border-on-background pt-safe" style="display: none;">
    <div class="h-16 flex items-center justify-between px-4 max-w-md mx-auto">
      <div class="flex items-center gap-2 cursor-pointer" onclick="window.router.navigate('home')">
        <!-- Logo Stamp -->
        <div class="w-9 h-9 border-2 border-on-background bg-primary-container flex items-center justify-center neo-shadow-sm transform -rotate-3">
          <svg fill="none" height="18" viewBox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L22 7.7735V16.2265L12 22L2 16.2265V7.7735L12 2Z" stroke="var(--on-background)" stroke-linejoin="round" stroke-width="2"></path>
            <path d="M9 10H15M9 14H13" stroke="var(--on-background)" stroke-linecap="round" stroke-width="2"></path>
          </svg>
        </div>
        <span class="font-headline-md text-xl uppercase tracking-tighter text-on-background">NoteHive</span>
      </div>

      <div class="flex items-center gap-3">
        <!-- Notification Bell -->
        <button id="header-notif-btn" class="w-10 h-10 neo-border bg-surface neo-shadow-sm flex items-center justify-center relative active:translate-x-0.5 active:translate-y-0.5">
          <span class="material-symbols-outlined text-xl text-on-background">notifications</span>
          <span id="header-notif-badge" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-error text-white font-label-bold text-[10px] items-center justify-center neo-border" style="display: none;">
            0
          </span>
        </button>

        <!-- Profile Avatar -->
        <button id="header-profile-btn" class="w-10 h-10 neo-border bg-primary-container flex items-center justify-center neo-shadow-sm active:translate-x-0.5 active:translate-y-0.5">
          <span class="material-symbols-outlined text-xl text-on-background font-bold">person</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Toast Notification Overlay -->
  <div id="toast-container" class="fixed top-20 left-0 right-0 z-50 flex flex-col items-center gap-2 pointer-events-none px-4 max-w-md mx-auto"></div>

  <!-- Main View Router Container -->
  <main id="app-main-content" class="w-full min-h-screen"></main>

  <!-- Global Floating Action Button ("+" Composer) -->
  <button id="app-fab" class="fixed bottom-24 right-4 z-40 w-14 h-14 bg-primary-fixed neo-border neo-shadow-lg flex items-center justify-center cursor-pointer active:translate-x-1 active:translate-y-1 active:shadow-none transition-all" style="display: none;" title="Share Note or Resource Link">
    <span class="material-symbols-outlined text-3xl font-black text-black">add</span>
  </button>

  <!-- Fixed Bottom Navigation Bar -->
  <nav id="app-bottom-nav" class="fixed bottom-0 w-full z-50 bg-surface border-t-4 border-on-background pb-safe" style="display: none;">
    <div class="h-16 flex justify-around items-center px-2 max-w-md mx-auto">
      <a href="#" data-route="home" class="app-nav-item flex flex-col items-center justify-center gap-0.5 px-3 py-1 border-4 border-on-background bg-primary-container shadow-none translate-x-1 translate-y-1 transition-all">
        <span class="material-symbols-outlined font-bold text-lg text-on-background">dynamic_feed</span>
        <span class="font-label-bold text-[10px] uppercase text-on-background">Home</span>
      </a>

      <a href="#" data-route="department" class="app-nav-item flex flex-col items-center justify-center gap-0.5 px-3 py-1 border-4 border-on-background bg-surface neo-shadow-sm transition-all">
        <span class="material-symbols-outlined font-bold text-lg text-on-background">domain</span>
        <span class="font-label-bold text-[10px] uppercase text-on-background">Department</span>
      </a>

      <a href="#" data-route="leaderboard" class="app-nav-item flex flex-col items-center justify-center gap-0.5 px-3 py-1 border-4 border-on-background bg-surface neo-shadow-sm transition-all">
        <span class="material-symbols-outlined font-bold text-lg text-on-background">leaderboard</span>
        <span class="font-label-bold text-[10px] uppercase text-on-background">Ranking</span>
      </a>

      <a href="#" data-route="profile" class="app-nav-item flex flex-col items-center justify-center gap-0.5 px-3 py-1 border-4 border-on-background bg-surface neo-shadow-sm transition-all">
        <span class="material-symbols-outlined font-bold text-lg text-on-background">person</span>
        <span class="font-label-bold text-[10px] uppercase text-on-background">Profile</span>
      </a>
    </div>
  </nav>

  <!-- JS Dependencies & Modules -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/welcome.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/department.js"></script>
  <script src="js/views/subjects.js"></script>
  <script src="js/views/subjectDetail.js"></script>
  <script src="js/views/noteDetail.js"></script>
  <script src="js/views/composer.js"></script>
  <script src="js/views/leaderboard.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/moderation.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
