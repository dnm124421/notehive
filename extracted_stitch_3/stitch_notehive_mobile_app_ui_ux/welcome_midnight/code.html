<img class="w-full h-full object-cover grayscale brightness-75 contrast-125" data-alt="A gritty, high-contrast digital illustration in a dark zine style. A college student sits at a messy desk cluttered with papers and books, hunched over a glowing digital tablet. Above their head, a single lightbulb glows intensely in neon yellow, casting harsh shadows. The art style uses heavy black ink lines, cross-hatching, and subtle paper grain textures, with a palette of midnight black, electric lime, and hot pink accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDafQz8_lWzN0RJ2GSDhgNxhDqSjgNjJ9D1EixSn1nRsDtzuQMZmHzWxpCKNdW3Lq8OuNYe7EGp4qEgE1pU0l_Mm2w_qlrmBXASS7nJDOssstTVAFnFlBuxZ-C3VRtpgmDsGyIDnEaKOTzrD_31syI9pn5cc_2_NQ3RCkdSsV1Zk46m3olbxCbBhWaH_JE08O7mZotXl-xhI6lu1S-ZBtVtm7TJLnsEb85kCwJcWV-eAxHicU3jG1Fl"/>

<div class="flex justify-center items-center gap-4">

</div>

<div class="w-full h-8 opacity-40 rotate-180" style="background-image: repeating-conic-gradient(#ffffff 0% 25%, transparent 0% 50%); background-size: 16px 16px;"></div>
<script>
    // Subtle interactivity: Shake effect on the "Chaos" text periodically
    const chaosText = document.querySelector('h1:last-of-type');
    setInterval(() => {
      chaosText.style.transform = `translate(${Math.random() * 2 - 1}px, ${Math.random() * 2 - 1}px) rotate(${Math.random() * 2 - 1}deg)`;
      setTimeout(() => {
        chaosText.style.transform = 'none';
      }, 100);
    }, 3000);

    // Particle-like 'ink splats' on click
    document.addEventListener('click', (e) => {
      const splat = document.createElement('div');
      splat.className = 'fixed pointer-events-none z-50 rounded-full bg-primary-container';
      splat.style.width = Math.random() * 8 + 4 + 'px';
      splat.style.height = splat.style.width;
      splat.style.left = e.clientX + 'px';
      splat.style.top = e.clientY + 'px';
      splat.style.opacity = '0.7';
      splat.style.transition = 'all 0.5s cubic-bezier(0.23, 1, 0.32, 1)';
      document.body.appendChild(splat);
      
      requestAnimationFrame(() => {
        splat.style.transform = `scale(4) translate(${(Math.random() - 0.5) * 50}px, ${(Math.random() - 0.5) * 50}px)`;
        splat.style.opacity = '0';
      });
      
      setTimeout(() => splat.remove(), 500);
    });
  </script>
